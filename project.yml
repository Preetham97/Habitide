name: Habitide
options:
  bundleIdPrefix: com.preetham
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Habitide:
    type: application
    platform: iOS
    sources:
      - path: Habitide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.preetham.Habitide
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: Habitide
        ENABLE_PREVIEWS: "YES"
        DEVELOPMENT_ASSET_PATHS: "\"Habitide/Preview Content\""
        GENERATE_INFOPLIST_FILE: "YES"
